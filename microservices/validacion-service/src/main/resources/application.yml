spring:
  application:
    name: validacion-service

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    instance-id: ${spring.cloud.client.hostname}:${spring.application.name}:${random.int}

info:
  app:
    name: Validacion Service Lab7

management:
  endpoints:
    web:
      exposure:
        include: health,beans,loggers,info
